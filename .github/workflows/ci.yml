name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: swift --version
      - run: python3 scripts/generate.py
      - run: git diff --exit-code -- Sources/Erebine/Operations.swift
      - run: swift test
      - run: xcodebuild -scheme Erebine -destination 'generic/platform=iOS Simulator' -derivedDataPath work/ios CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -scheme Erebine -destination 'generic/platform=watchOS Simulator' -derivedDataPath work/watchos CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -scheme Erebine -destination 'generic/platform=tvOS Simulator' -derivedDataPath work/tvos CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -scheme Erebine -destination 'generic/platform=visionOS Simulator' -derivedDataPath work/visionos CODE_SIGNING_ALLOWED=NO build
